<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouvo Modpas — BetCode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#000000; --bg-elevated:#0D0D0D; --bg-card:#131313;
    --gold:#E8B34C; --text:#FFFFFF; --text-muted:rgba(255,255,255,0.55); --border:rgba(255,255,255,0.08);
    --red:#E8574C; --win:#4CAF7D;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1,.display{font-family:'Bebas Neue',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .card{
    width:100%; max-width:400px; background:var(--bg-card);
    border:1px solid var(--border); border-radius:14px; padding:32px 28px;
  }
  .logo{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Bebas Neue',sans-serif; font-weight:700; font-size:19px; margin-bottom:10px;
  }
  .logo .dot{width:8px;height:8px;background:var(--gold);border-radius:50%;box-shadow:0 0 12px var(--gold);}
  h1.title{font-size:22px;text-align:center;margin-bottom:8px;}
  .desc{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:26px;line-height:1.6;}
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px;
    font-family:'JetBrains Mono',monospace; letter-spacing:0.03em;
  }
  .field input{
    width:100%; padding:12px 14px; background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:14.5px; font-family:'Inter',sans-serif;
  }
  .field input:focus{outline:none; border-color:var(--gold);}
  .btn-submit{
    width:100%; padding:13px 0; background:var(--gold); color:#0A0A0A; border:none;
    border-radius:8px; font-weight:700; font-size:14.5px; cursor:pointer; margin-top:6px;
  }
  .btn-submit:hover{background:#F4C766;}
  .btn-submit:disabled{opacity:0.6;cursor:not-allowed;}
  .status-msg{
    font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:20px;
    font-family:'JetBrains Mono',monospace; line-height:1.5; display:none;
  }
  .status-msg.show{display:block;}
  .status-msg.error{background:rgba(232,87,76,0.1); border:1px solid rgba(232,87,76,0.3); color:var(--red);}
  .status-msg.success{background:rgba(76,175,125,0.1); border:1px solid rgba(76,175,125,0.3); color:var(--win);}
  .loading-state{text-align:center;color:var(--text-muted);font-size:13.5px;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="dot"></span>BET<span style="color:var(--gold)">CODE</span></div>
    <h1 class="title">Nouvo Modpas</h1>

    <div id="loadingState" class="loading-state">Verifikasyon lyen an...</div>

    <div id="formState" style="display:none;">
      <div class="desc">Antre nouvo modpas ou.</div>
      <div class="status-msg" id="statusMsg"></div>
      <form id="resetForm" onsubmit="handleSubmit(event)">
        <div class="field">
          <label>NOUVO MODPAS</label>
          <input type="password" placeholder="••••••••" required id="passInput" minlength="6">
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Mete Modpas Ajou</button>
      </form>
    </div>

    <div id="invalidState" style="display:none;" class="desc">
      Lyen sa a pa valid ankò oswa li ekspire. <a href="pronostik-forgot-password.html" style="color:var(--gold);">Mande yon nouvo lyen</a>.
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://ennivlexjektcwfshozl.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_jQWO3I8vDsUJshVYrWbRLg_Zn3Zafjz';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showStatus(msg, type){
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg show ' + type;
  }

  async function checkRecoverySession(){
    const { data: { session } } = await sb.auth.getSession();
    if(session){
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('formState').style.display = 'block';
      return;
    }

    let resolved = false;
    const { data: listener } = sb.auth.onAuthStateChange((event, newSession) => {
      if(newSession && !resolved){
        resolved = true;
        listener.subscription.unsubscribe();
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('formState').style.display = 'block';
      }
    });

    setTimeout(() => {
      if(resolved) return;
      listener.subscription.unsubscribe();
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('invalidState').style.display = 'block';
    }, 2000);
  }

  async function handleSubmit(e){
    e.preventDefault();
    const newPass = document.getElementById('passInput').value;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Ap mete ajou...';

    const { error } = await sb.auth.updateUser({ password: newPass });

    if(error){
      showStatus(error.message || 'Nou pa t ka chanje modpas la.', 'error');
      btn.disabled = false;
      btn.textContent = 'Mete Modpas Ajou';
    } else {
      showStatus('Modpas chanje avèk siksè! Ap mennen w sou dashboard la...', 'success');
      setTimeout(() => window.location.href = 'pronostik-dashboard.html', 1500);
    }
  }

  checkRecoverySession();
</script>
</body>
</html>
