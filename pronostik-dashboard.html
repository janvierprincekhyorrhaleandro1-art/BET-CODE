<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — BetCode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#000000; --bg-elevated:#0D0D0D; --bg-card:#131313;
    --gold:#E8B34C; --gold-bright:#F4C766; --gold-dim:#B8862F;
    --text:#FFFFFF; --text-muted:rgba(255,255,255,0.55); --border:rgba(255,255,255,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Bebas Neue',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px;}

  nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--border);}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.03em;display:flex;align-items:center;gap:8px;}
  .logo .dot{width:8px;height:8px;background:var(--gold);border-radius:50%;box-shadow:0 0 12px var(--gold);}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .plan-badge{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;background:rgba(232,179,76,0.12);
    color:var(--gold);border:1px solid rgba(232,179,76,0.3);padding:3px 8px;border-radius:5px;letter-spacing:0.05em;
  }
  .avatar-link{cursor:pointer;}
  .avatar{
    width:34px;height:34px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
  }
  .avatar-link:hover .avatar{border-color:var(--gold);}
  .lang-toggle{
    width:34px;height:34px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;
    font-weight:700;color:var(--text-muted);cursor:pointer;
  }
  .lang-toggle:hover{border-color:var(--gold);color:var(--gold);}

  .stats{display:flex;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:20px 0;}
  .stat{flex:1;padding:10px 16px;display:flex;align-items:center;gap:8px;}
  .stat:not(:last-child){border-right:1px solid var(--border);}
  .stat .label{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text-muted);letter-spacing:0.03em;}
  .stat .val{font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1;}
  .stat .val.gold{color:var(--gold);}
  @media(max-width:600px){.stats{flex-direction:column;} .stat:not(:last-child){border-right:none;border-bottom:1px solid var(--border);}}

  .filter-block{margin-bottom:20px;}
  .filter-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:0.05em;margin-bottom:8px;}
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--border);font-size:13px;color:var(--text-muted);white-space:nowrap;cursor:pointer;}
  .chip.active{background:var(--gold);border-color:var(--gold);color:#0A0A0A;font-weight:600;}

  .tips-list{display:flex;flex-direction:column;gap:12px;padding-bottom:60px;}
  .tip-row{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s;}
  .tip-row:hover{border-color:var(--gold);}
  .tip-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .tip-league{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);}
  .tip-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);}
  .tip-match{font-size:15.5px;font-weight:600;margin-bottom:14px;}
  .tip-bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;}
  .tip-pick{font-size:13.5px;color:var(--text-muted);}
  .tip-pick b{color:var(--gold);font-weight:600;}
  .conf-wrap{display:flex;align-items:center;gap:8px;min-width:96px;}
  .conf-bar{flex:1;height:5px;background:var(--bg-elevated);border-radius:3px;overflow:hidden;}
  .conf-bar span{display:block;height:100%;background:var(--gold);border-radius:3px;}
  .conf-pct{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold);}

  .tip-row.locked .tip-match,.tip-row.locked .tip-bottom{filter:blur(5px);user-select:none;}
  .tip-row.locked{cursor:default;}
  .lock-tag{position:absolute;top:16px;right:18px;font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(232,179,76,0.12);color:var(--gold);border:1px solid rgba(232,179,76,0.3);padding:3px 8px;border-radius:5px;z-index:2;}
  .lock-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,0.55);font-size:13px;color:var(--text-muted);z-index:1;}
  .lock-overlay a{color:var(--gold);font-weight:600;cursor:pointer;}

  .load-more{display:block;width:100%;padding:13px 0;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-size:14px;text-align:center;cursor:pointer;}
  .load-more:hover{border-color:var(--gold);color:var(--text);}

  .research-btn{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-muted);
    background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;padding:5px 10px;
    cursor:pointer;margin-top:10px;
  }
  .research-btn:hover{border-color:var(--gold);color:var(--gold);}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
    max-width:440px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;position:relative;
  }
  .modal-close{position:absolute;top:14px;right:16px;color:var(--text-muted);cursor:pointer;font-size:18px;}
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:19px;margin-bottom:16px;padding-right:24px;}
  .modal-spinner{
    display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;color:var(--text-muted);font-size:13px;
  }
  .spinner{
    width:32px;height:32px;border:3px solid var(--bg-elevated);border-top-color:var(--gold);
    border-radius:50%;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .modal-body{font-size:13.5px;color:var(--text-muted);line-height:1.7;white-space:pre-wrap;}
</style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="logo" href="index.html"><span class="dot"></span>BET<span style="color:var(--gold)">CODE</span></a>
      <div class="nav-right">
        <span class="plan-badge" id="planBadge">PLAN GRATIS</span>
        <a class="avatar-link" href="pronostik-account.html"><div class="avatar" id="avatarInitials">--</div></a>
        <div class="lang-toggle" id="langToggle" onclick="toggleLang()">HT</div>
      </div>
    </nav>

    <div class="stats">
      <div class="stat"><span class="label" data-i18n="stat_matches">MATCH JODIA</span><span class="val">47</span></div>
      <div class="stat"><span class="label" data-i18n="stat_accuracy">PRESIZYON 30J</span><span class="val gold">68%</span></div>
      <div class="stat"><span class="label" data-i18n="stat_tips">TIPS JODIA</span><span class="val">12</span></div>
    </div>

    <div class="filter-block">
      <div class="filter-label" data-i18n="filter_competition">// KONPETISYON</div>
      <div class="filters" id="leagueFilters">
        <div class="chip active" data-league="all" data-i18n="chip_all">Tout</div>
      </div>
    </div>

    <div class="filter-block">
      <div class="filter-label" data-i18n="filter_date">// DAT</div>
      <div class="filters" id="dateFilters">
        <div class="chip active" data-offset="0" data-i18n="chip_today">Jodia</div>
        <div class="chip" data-offset="1" data-i18n="chip_tomorrow">Demen</div>
        <div class="chip" data-offset="2" data-i18n="chip_after_tomorrow">Apre Demen</div>
        <div class="chip" data-offset="3" data-i18n="chip_in3">Nan 3 Jou</div>
        <div class="chip" data-offset="4" data-i18n="chip_in4">Nan 4 Jou</div>
        <div class="chip" data-offset="5" data-i18n="chip_in5">Nan 5 Jou</div>
      </div>
    </div>

    <div class="tips-list" id="tipsList">
      <div style="text-align:center;color:var(--text-muted);font-size:13px;padding:30px 0;" id="tipsLoading">Chajman tips...</div>
    </div>

    <div class="load-more" id="loadMoreBtn" data-i18n="load_more">Chaje Rès Match Jounen an</div>
  </div>

<script>
  const SUPABASE_URL = 'https://ennivlexjektcwfshozl.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_jQWO3I8vDsUJshVYrWbRLg_Zn3Zafjz';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------- i18n ----------
  const translations = {
    ht: {
      stat_matches:'MATCH JODIA', stat_accuracy:'PRESIZYON 30J', stat_tips:'TIPS JODIA',
      filter_competition:'// KONPETISYON', filter_date:'// DAT',
      chip_all:'Tout', chip_today:'Jodia', chip_tomorrow:'Demen', chip_after_tomorrow:'Apre Demen',
      chip_in3:'Nan 3 Jou', chip_in4:'Nan 4 Jou', chip_in5:'Nan 5 Jou',
      league_champions:'Lig dè Chanpyon',
      market_goals:'Total Gòl', market_double_chance:'Rezilta Double Chans', market_btts:'Toude Ekip Make',
      market_corners:'Total Kòne', market_multi:'Miltip 3 Match',
      pick_over25:'Plis 2.5', pick_over35:'Plis 3.5', pick_over95:'Plis 9.5', pick_yes:'Wi', pick_bigodds:'Gwo Kòt',
      unlock_vip:'Vin VIP pou dekloke',
      load_more:'Chaje Rès Match Jounen an', load_more_done:'Pa gen plis match pou jodia a',
      plan_gratis:'PLAN GRATIS', plan_pro:'PLAN PRO', plan_vip:'PLAN VIP'
    },
    fr: {
      stat_matches:'MATCHS AUJOURD\\'HUI', stat_accuracy:'PRÉCISION 30J', stat_tips:'TIPS AUJOURD\\'HUI',
      filter_competition:'// COMPÉTITION', filter_date:'// DATE',
      chip_all:'Tous', chip_today:'Aujourd\\'hui', chip_tomorrow:'Demain', chip_after_tomorrow:'Après-demain',
      chip_in3:'Dans 3 Jours', chip_in4:'Dans 4 Jours', chip_in5:'Dans 5 Jours',
      league_champions:'Ligue des Champions',
      market_goals:'Total Buts', market_double_chance:'Double Chance', market_btts:'Les Deux Équipes Marquent',
      market_corners:'Total Corners', market_multi:'Multiple 3 Matchs',
      pick_over25:'Plus de 2.5', pick_over35:'Plus de 3.5', pick_over95:'Plus de 9.5', pick_yes:'Oui', pick_bigodds:'Grosse Cote',
      unlock_vip:'Devenez VIP pour débloquer',
      load_more:'Charger le reste des matchs', load_more_done:'Plus de matchs pour aujourd\\'hui',
      plan_gratis:'PLAN GRATUIT', plan_pro:'PLAN PRO', plan_vip:'PLAN VIP'
    }
  };

  let currentPlanKey = 'gratis';
  let loadMoreExhausted = false;

  function getLang(){ return localStorage.getItem('betcode_lang') || 'ht'; }
  function setLang(lang){ localStorage.setItem('betcode_lang', lang); applyTranslations(); }
  function toggleLang(){ setLang(getLang() === 'ht' ? 'fr' : 'ht'); }

  function applyTranslations(){
    const lang = getLang();
    const dict = translations[lang];
    document.getElementById('langToggle').textContent = lang.toUpperCase();
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(dict[key]) el.textContent = dict[key];
    });
    document.getElementById('planBadge').textContent = dict['plan_' + currentPlanKey];
    document.getElementById('loadMoreBtn').textContent = loadMoreExhausted ? dict.load_more_done : dict.load_more;
  }

  // ---------- Auth / profile ----------
  function initials(name){
    if(!name) return '--';
    const parts = name.trim().split(' ').filter(Boolean);
    return (parts[0]?.[0] || '').toUpperCase() + (parts[1]?.[0] || '').toUpperCase();
  }

  let currentPlanRank = 0;
  let allTips = [];
  const PLAN_RANK = { gratis: 0, pro: 1, vip: 2 };

  async function populateDashboard(session){
    const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    const name = profile?.full_name || session.user.user_metadata?.full_name || '';
    document.getElementById('avatarInitials').textContent = initials(name);
    currentPlanKey = profile?.plan || 'gratis';
    currentPlanRank = PLAN_RANK[currentPlanKey] ?? 0;
    applyTranslations();
    loadTips();
  }

  async function loadTips(){
    const { data, error } = await sb
      .from('tips')
      .select('*')
      .eq('status', 'published')
      .order('match_date', { ascending: true })
      .order('kickoff_time', { ascending: true });

    if(error){
      console.error('Load tips error:', error);
      document.getElementById('tipsList').innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:30px 0;">Nou pa t ka chaje tips yo.</div>';
      return;
    }
    allTips = data || [];
    populateLeagueChips();
    renderTips();
  }

  function populateLeagueChips(){
    const group = document.getElementById('leagueFilters');
    const leagues = [...new Set(allTips.map(t => t.league))].sort();
    // Keep the "Tout" chip, append one chip per distinct league actually present
    group.querySelectorAll('.chip:not([data-league="all"])').forEach(el => el.remove());
    leagues.forEach(league => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.setAttribute('data-league', league);
      chip.textContent = league;
      chip.addEventListener('click', () => {
        group.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        renderTips();
      });
      group.appendChild(chip);
    });
  }

  function renderTips(){
    const activeLeague = document.querySelector('#leagueFilters .chip.active')?.getAttribute('data-league') || 'all';
    const activeOffset = document.querySelector('#dateFilters .chip.active')?.getAttribute('data-offset') || '0';

    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + parseInt(activeOffset, 10));
    const targetDateStr = targetDate.toISOString().slice(0, 10);

    const filtered = allTips.filter(t => {
      const leagueMatch = activeLeague === 'all' || t.league === activeLeague;
      const dateMatch = t.match_date === targetDateStr;
      return leagueMatch && dateMatch;
    });

    const list = document.getElementById('tipsList');
    if(filtered.length === 0){
      list.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:30px 0;">Pa gen tips pou seleksyon sa a.</div>';
      return;
    }

    list.innerHTML = filtered.map(t => {
      const tipRank = PLAN_RANK[t.access_level] ?? 0;
      const locked = tipRank > currentPlanRank;
      const rowClass = locked ? 'tip-row locked' : 'tip-row';
      const clickAttr = locked ? '' : `onclick="window.location.href='pronostik-tip-detail.html?id=${t.id}'"`;
      const lockTag = locked ? `<div class="lock-tag mono">${t.access_level.toUpperCase()}</div>` : '';
      const lockOverlay = locked
        ? `<div class="lock-overlay">🔒 <a href="pronostik-checkout.html">Vin ${t.access_level.toUpperCase()} pou dekloke</a></div>`
        : '';
      const researchBtn = locked ? '' : `<div class="research-btn" onclick="event.stopPropagation(); openResearch('${escapeHtml(t.match_label)}')">🔍 Rechèch Live</div>`;
      return `
      <div class="${rowClass}" ${clickAttr}>
        ${lockTag}
        <div class="tip-top"><span class="tip-league mono">${escapeHtml(t.league)}</span><span class="tip-time mono">${escapeHtml(t.kickoff_time || '')}</span></div>
        <div class="tip-match">${escapeHtml(t.match_label)}</div>
        <div class="tip-bottom">
          <div class="tip-pick">${escapeHtml(t.market)} — <b>${escapeHtml(t.pick)}</b></div>
          <div class="conf-wrap"><div class="conf-bar"><span style="width:${t.confidence}%"></span></div><span class="conf-pct">${t.confidence}%</span></div>
        </div>
        ${researchBtn}
        ${lockOverlay}
      </div>`;
    }).join('');
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  async function loadUser(){
    const { data: { session } } = await sb.auth.getSession();
    if(session){ populateDashboard(session); return; }

    let resolved = false;
    const { data: listener } = sb.auth.onAuthStateChange((event, newSession) => {
      if(newSession && !resolved){
        resolved = true;
        listener.subscription.unsubscribe();
        populateDashboard(newSession);
      }
    });

    setTimeout(async () => {
      if(resolved) return;
      const { data: { session: retrySession } } = await sb.auth.getSession();
      if(retrySession){
        resolved = true;
        listener.subscription.unsubscribe();
        populateDashboard(retrySession);
      } else {
        listener.subscription.unsubscribe();
        window.location.href = 'pronostik-auth.html';
      }
    }, 1500);
  }

  document.querySelectorAll('.filters').forEach(group => {
    group.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        group.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        renderTips();
      });
    });
  });

  document.getElementById('loadMoreBtn').addEventListener('click', function(){
    loadTips();
  });

  async function openResearch(matchLabel){
    document.getElementById('modalTitle').textContent = matchLabel;
    document.getElementById('modalContent').innerHTML = `
      <div class="modal-spinner">
        <div class="spinner"></div>
        <div>Ap chèche enfòmasyon yo...</div>
      </div>`;
    document.getElementById('researchModal').classList.add('show');

    const parts = matchLabel.split('—').map(s => s.trim());
    const homeTeam = parts[0] || matchLabel;
    const awayTeam = parts[1] || '';

    try {
      const res = await fetch('/api/analyze-match', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ homeTeam, awayTeam })
      });
      const data = await res.json();
      if(!res.ok){
        document.getElementById('modalContent').innerHTML = `<div class="modal-body">Erè: ${data.error || 'Nou pa t ka fè rechèch la.'}</div>`;
        return;
      }
      document.getElementById('modalContent').innerHTML = `<div class="modal-body">${(data.analysis || '').replace(/</g,'&lt;')}</div>`;
    } catch(err){
      console.error('Research fetch error:', err);
      document.getElementById('modalContent').innerHTML = `<div class="modal-body">Nou pa t ka konekte ak sèvis rechèch la.</div>`;
    }
  }

  function closeResearch(){
    document.getElementById('researchModal').classList.remove('show');
  }

  applyTranslations();
  loadUser();
</script>

  <div class="modal-overlay" id="researchModal">
    <div class="modal-box">
      <span class="modal-close" onclick="closeResearch()">✕</span>
      <div class="modal-title" id="modalTitle">Rechèch Live</div>
      <div id="modalContent">
        <div class="modal-spinner">
          <div class="spinner"></div>
          <div>Ap chèche enfòmasyon yo...</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
