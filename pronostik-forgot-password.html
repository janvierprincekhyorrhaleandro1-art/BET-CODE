<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bliye Modpas — BetCode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000; --bg-elevated:#0D0D0D; --bg-card:#131313;
    --gold:#E8B34C; --text:#FFFFFF; --text-muted:rgba(255,255,255,0.55); --border:rgba(255,255,255,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1,.display{font-family:'Bebas Neue',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .card{
    width:100%; max-width:400px; background:var(--bg-card);
    border:1px solid var(--border); border-radius:14px; padding:32px 28px;
  }
  .logo{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Bebas Neue',sans-serif; font-weight:700; font-size:19px; margin-bottom:10px;
  }
  .logo .dot{width:8px;height:8px;background:var(--gold);border-radius:50%;box-shadow:0 0 12px var(--gold);}
  h1.title{font-size:22px;text-align:center;margin-bottom:8px;}
  .desc{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:26px;line-height:1.6;}
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px;
    font-family:'JetBrains Mono',monospace; letter-spacing:0.03em;
  }
  .field input{
    width:100%; padding:12px 14px; background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:14.5px; font-family:'Inter',sans-serif;
  }
  .field input:focus{outline:none; border-color:var(--gold);}
  .field input::placeholder{color:#4A5468;}
  .btn-submit{
    width:100%; padding:13px 0; background:var(--gold); color:#0A0A0A; border:none;
    border-radius:8px; font-weight:700; font-size:14.5px; cursor:pointer; margin-top:6px;
  }
  .btn-submit:hover{background:#F4C766;}
  .success-box{
    display:none; background:rgba(76,175,125,0.1); border:1px solid rgba(76,175,125,0.3);
    border-radius:10px; padding:14px 16px; font-size:13px; color:#4CAF7D; margin-bottom:20px; line-height:1.6;
  }
  .success-box.show{display:block;}
  .fine{text-align:center; font-size:12.5px; color:var(--text-muted); margin-top:20px;}
  .fine a{color:var(--gold); text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="dot"></span>BET<span style="color:var(--gold)">CODE</span></div>
    <h1 class="title">Bliye Modpas?</h1>
    <div class="desc">Antre imel kont ou epi n ap voye w yon lyen pou reyajiste modpas la.</div>

    <div class="success-box" id="successBox">✓ Si yon kont egziste ak imel sa a, w ap resevwa yon lyen nan pwochèn minit yo.</div>

    <form id="resetForm" onsubmit="handleSubmit(event)">
      <div class="field">
        <label>IMEL</label>
        <input type="email" placeholder="ou@egzanp.com" required id="emailInput">
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Voye Lyen Reyajistman</button>
    </form>

    <div class="fine">Sonje modpas ou? <a href="#">Konekte</a></div>
  </div>

<script>
  function handleSubmit(e){
    e.preventDefault();
    document.getElementById('successBox').classList.add('show');
    document.getElementById('submitBtn').textContent = 'Lyen Voye ✓';
    document.getElementById('submitBtn').style.opacity = '0.7';
  }
</script>
</body>
</html>
