<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konekte — BetCode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#000000; --bg-elevated:#0D0D0D; --bg-card:#131313;
    --gold:#E8B34C; --text:#FFFFFF; --text-muted:rgba(255,255,255,0.55); --border:rgba(255,255,255,0.08);
    --red:#E8574C; --win:#4CAF7D;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1,.display{font-family:'Bebas Neue',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .card{
    width:100%; max-width:400px; background:var(--bg-card);
    border:1px solid var(--border); border-radius:14px; padding:32px 28px;
  }
  .logo{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Bebas Neue',sans-serif; font-weight:700; font-size:19px; margin-bottom:28px;
  }
  .logo .dot{width:8px;height:8px;background:var(--gold);border-radius:50%;box-shadow:0 0 12px var(--gold);}
  .tabs{
    display:flex; background:var(--bg-elevated); border-radius:9px; padding:4px; margin-bottom:24px;
  }
  .tab{
    flex:1; text-align:center; padding:9px 0; border-radius:6px; font-size:13.5px;
    font-weight:600; cursor:pointer; color:var(--text-muted); transition:all .15s;
  }
  .tab.active{background:var(--gold); color:#0A0A0A;}
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px;
    font-family:'JetBrains Mono',monospace; letter-spacing:0.03em;
  }
  .field input{
    width:100%; padding:12px 14px; background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:14.5px; font-family:'Inter',sans-serif;
  }
  .field input:focus{outline:none; border-color:var(--gold);}
  .field input::placeholder{color:#4A5468;}
  .phone-row{display:flex;gap:8px;}
  .phone-prefix{
    flex-shrink:0; width:76px; padding:12px 10px; background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:8px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .phone-row input{font-family:'JetBrains Mono',monospace;}
  .btn-submit{
    width:100%; padding:13px 0; background:var(--gold); color:#0A0A0A; border:none;
    border-radius:8px; font-weight:700; font-size:14.5px; cursor:pointer; margin-top:6px;
  }
  .btn-submit:hover{background:#F4C766;}
  .btn-submit:disabled{opacity:0.6;cursor:not-allowed;}
  .divider{
    display:flex; align-items:center; gap:12px; margin:22px 0;
    font-size:11.5px; color:var(--text-muted); font-family:'JetBrains Mono',monospace;
  }
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .fine{text-align:center; font-size:12px; color:var(--text-muted); margin-top:18px; line-height:1.6;}
  .fine a{color:var(--gold);}
  .signup-only{display:none;}
  .login-only{display:block;}
  .signup-mode .signup-only{display:block;}
  .signup-mode .login-only{display:none;}
  .status-msg{
    font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:20px;
    font-family:'JetBrains Mono',monospace; line-height:1.5; display:none;
  }
  .status-msg.show{display:block;}
  .status-msg.error{background:rgba(232,87,76,0.1); border:1px solid rgba(232,87,76,0.3); color:var(--red);}
  .status-msg.success{background:rgba(76,175,125,0.1); border:1px solid rgba(76,175,125,0.3); color:var(--win);}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo"><span class="dot"></span>BET<span style="color:var(--gold)">CODE</span></div>

    <div class="status-msg" id="statusMsg"></div>

    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="setMode('login')">Konekte</div>
      <div class="tab" id="tabSignup" onclick="setMode('signup')">Kreye Kont</div>
    </div>

    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="field signup-only">
        <label>NON KONPLÈ</label>
        <input type="text" placeholder="Jan yo rele w" id="nameInput">
      </div>

      <div class="field signup-only">
        <label>IMEL</label>
        <input type="email" placeholder="ou@egzanp.com" id="emailInput">
      </div>
      <div class="field signup-only">
        <label>NIMEWO TELEFÒN</label>
        <div class="phone-row">
          <div class="phone-prefix">+509</div>
          <input type="tel" placeholder="4821****" id="phoneInput" inputmode="numeric" maxlength="8">
        </div>
      </div>

      <div class="field login-only">
        <label>IMEL OSWA NIMEWO TELEFÒN</label>
        <input type="text" placeholder="ou@egzanp.com oswa 31066407" id="identifierInput">
      </div>

      <div class="field">
        <label>MODPAS</label>
        <input type="password" placeholder="••••••••" required id="passInput" minlength="6">
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Konekte</button>
    </form>

    <div class="fine" style="margin-top:6px;"><a href="pronostik-forgot-password.html">Bliye modpas ou?</a></div>

    <div class="fine">
      Lè w kreye yon kont, ou aksepte Kondisyon Sèvis nou yo.<br>
      Sèvis sa a rezève pou moun <b>18 an oswa plis</b>.
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://ennivlexjektcwfshozl.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_jQWO3I8vDsUJshVYrWbRLg_Zn3Zafjz';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function setMode(mode){
    const card = document.getElementById('card');
    const btn = document.getElementById('submitBtn');
    document.getElementById('tabLogin').classList.toggle('active', mode==='login');
    document.getElementById('tabSignup').classList.toggle('active', mode==='signup');
    hideStatus();
    if(mode==='signup'){
      card.classList.add('signup-mode');
      btn.textContent = 'Kreye Kont';
      document.getElementById('emailInput').required = true;
    } else {
      card.classList.remove('signup-mode');
      btn.textContent = 'Konekte';
      document.getElementById('emailInput').required = false;
    }
  }

  function showStatus(msg, type){
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg show ' + type;
  }
  function hideStatus(){
    document.getElementById('statusMsg').className = 'status-msg';
  }

  function extractErrorMessage(err){
    if(!err) return 'Yon erè initil pase. Eseye ankò.';
    if(typeof err === 'string') return err;
    if(err.message) return err.message;
    if(err.error_description) return err.error_description;
    return 'Yon erè initil pase (kod: ' + (err.status || err.code || '?') + ').';
  }

  function normalizePhone(raw){
    let digits = raw.replace(/[^\d]/g, '');
    if(digits.length === 8) digits = '509' + digits;
    return '+' + digits;
  }

  async function handleSubmit(e){
    e.preventDefault();
    hideStatus();
    const password = document.getElementById('passInput').value;
    const isSignup = document.getElementById('card').classList.contains('signup-mode');
    const btn = document.getElementById('submitBtn');
    const originalLabel = btn.textContent;

    btn.disabled = true;
    btn.textContent = 'Tann...';

    try {
      let result;

      if(isSignup){
        const name = document.getElementById('nameInput').value.trim();
        const email = document.getElementById('emailInput').value.trim();
        const phoneDigits = document.getElementById('phoneInput').value.trim();
        const phone = phoneDigits ? normalizePhone(phoneDigits) : null;

        result = await sb.auth.signUp({
          email, password,
          options: { data: { full_name: name, phone } }
        });

      } else {
        const identifier = document.getElementById('identifierInput').value.trim();
        let loginEmail = identifier;

        if(!identifier.includes('@')){
          // Treat as phone — look up which email it's registered under
          const phone = normalizePhone(identifier);
          const { data: foundEmail, error: lookupErr } = await sb.rpc('get_email_by_phone', { phone_input: phone });
          if(lookupErr || !foundEmail){
            showStatus('Nou pa jwenn okenn kont ak nimewo telefòn sa a.', 'error');
            btn.disabled = false;
            btn.textContent = originalLabel;
            return;
          }
          loginEmail = foundEmail;
        }

        result = await sb.auth.signInWithPassword({ email: loginEmail, password });
      }

      if(result.error){
        console.error('Auth error:', result.error);
        showStatus(extractErrorMessage(result.error), 'error');
      } else if(isSignup){
        showStatus('Kont kreye avèk siksè!', 'success');
        setTimeout(() => window.location.href = 'pronostik-dashboard.html', 1200);
      } else {
        showStatus('Ou konekte!', 'success');
        setTimeout(() => window.location.href = 'pronostik-dashboard.html', 800);
      }
    } catch(err){
      console.error('Unexpected error:', err);
      showStatus(extractErrorMessage(err), 'error');
    }

    btn.disabled = false;
    btn.textContent = originalLabel;
  }

</script>
</body>
</html>
