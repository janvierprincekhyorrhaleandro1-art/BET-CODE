<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konekte — BetCode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#000000; --bg-elevated:#0D0D0D; --bg-card:#131313;
    --gold:#E8B34C; --text:#FFFFFF; --text-muted:rgba(255,255,255,0.55); --border:rgba(255,255,255,0.08);
    --red:#E8574C; --win:#4CAF7D;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1,.display{font-family:'Bebas Neue',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .card{
    width:100%; max-width:400px; background:var(--bg-card);
    border:1px solid var(--border); border-radius:14px; padding:32px 28px;
  }
  .logo{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Bebas Neue',sans-serif; font-weight:700; font-size:19px; margin-bottom:8px;
  }
  .logo .dot{width:8px;height:8px;background:var(--gold);border-radius:50%;box-shadow:0 0 12px var(--gold);}
  h1.title{font-size:21px;text-align:center;margin-bottom:6px;}
  .desc{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:26px;line-height:1.6;}
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px;
    font-family:'JetBrains Mono',monospace; letter-spacing:0.03em;
  }
  .field input{
    width:100%; padding:12px 14px; background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:14.5px; font-family:'Inter',sans-serif;
  }
  .field input:focus{outline:none; border-color:var(--gold);}
  .field input::placeholder{color:#4A5468;}
  #codeInput{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.4em;text-align:center;}
  .btn-submit{
    width:100%; padding:13px 0; background:var(--gold); color:#0A0A0A; border:none;
    border-radius:8px; font-weight:700; font-size:14.5px; cursor:pointer; margin-top:6px;
  }
  .btn-submit:hover{background:#F4C766;}
  .btn-submit:disabled{opacity:0.6;cursor:not-allowed;}
  .divider{
    display:flex; align-items:center; gap:12px; margin:22px 0;
    font-size:11.5px; color:var(--text-muted); font-family:'JetBrains Mono',monospace;
  }
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .fine{text-align:center; font-size:12px; color:var(--text-muted); margin-top:18px; line-height:1.6;}
  .fine a{color:var(--gold); cursor:pointer;}
  .status-msg{
    font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:20px;
    font-family:'JetBrains Mono',monospace; line-height:1.5; display:none;
  }
  .status-msg.show{display:block;}
  .status-msg.error{background:rgba(232,87,76,0.1); border:1px solid rgba(232,87,76,0.3); color:var(--red);}
  .status-msg.success{background:rgba(76,175,125,0.1); border:1px solid rgba(76,175,125,0.3); color:var(--win);}
  .step{display:none;}
  .step.active{display:block;}
  .resend{text-align:center;font-size:12.5px;color:var(--text-muted);margin-top:14px;}
  .resend a{color:var(--gold);cursor:pointer;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="dot"></span>BET<span style="color:var(--gold)">CODE</span></div>

    <div class="status-msg" id="statusMsg"></div>

    <!-- STEP 1: Email -->
    <div class="step active" id="stepEmail">
      <h1 class="title">Konekte oswa Kreye Kont</h1>
      <div class="desc">Antre imel ou — n ap voye w yon kòd verifikasyon 6 chif.</div>

      <form onsubmit="sendCode(event)">
        <div class="field">
          <label>NON (SI SE PREMYE FWA)</label>
          <input type="text" placeholder="Jan yo rele w" id="nameInput">
        </div>
        <div class="field">
          <label>IMEL</label>
          <input type="email" placeholder="ou@egzanp.com" required id="emailInput">
        </div>
        <button type="submit" class="btn-submit" id="sendBtn">Voye Kòd la</button>
      </form>

      <div class="divider">OSWA</div>
      <button class="btn-submit" style="background:var(--bg-elevated); color:var(--text); border:1px solid var(--border);" onclick="handleGoogle()">Kontinye ak Google</button>
    </div>

    <!-- STEP 2: Code -->
    <div class="step" id="stepCode">
      <h1 class="title">Antre Kòd la</h1>
      <div class="desc">Nou voye yon kòd 6 chif nan <b id="emailDisplay" style="color:var(--text)"></b></div>

      <form onsubmit="verifyCode(event)">
        <div class="field">
          <label>KÒD VERIFIKASYON</label>
          <input type="text" placeholder="000000" maxlength="6" required id="codeInput" inputmode="numeric">
        </div>
        <button type="submit" class="btn-submit" id="verifyBtn">Konfime</button>
      </form>
      <div class="resend">Pa resevwa l? <a onclick="resendCode()">Voye kòd ankò</a> · <a onclick="backToEmail()">Chanje imel</a></div>
    </div>

    <div class="fine">
      Lè w kontinye, ou aksepte Kondisyon Sèvis nou yo.<br>
      Sèvis sa a rezève pou moun <b>18 an oswa plis</b>.
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://ennivlexjektcwfshozl.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_jQWO3I8vDsUJshVYrWbRLg_Zn3Zafjz';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let pendingEmail = '';

  function showStatus(msg, type){
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg show ' + type;
  }
  function hideStatus(){
    document.getElementById('statusMsg').className = 'status-msg';
  }

  function extractErrorMessage(err){
    if(!err) return 'Yon erè initil pase. Eseye ankò.';
    if(typeof err === 'string') return err;
    if(err.message) return err.message;
    if(err.error_description) return err.error_description;
    return 'Yon erè initil pase (kod: ' + (err.status || err.code || '?') + ').';
  }

  async function sendCode(e){
    e.preventDefault();
    hideStatus();
    const email = document.getElementById('emailInput').value.trim();
    const name = document.getElementById('nameInput').value.trim();
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = 'Ap voye...';

    try {
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { shouldCreateUser: true, data: { full_name: name } }
      });
      if(error){
        showStatus(extractErrorMessage(error), 'error');
      } else {
        pendingEmail = email;
        document.getElementById('emailDisplay').textContent = email;
        document.getElementById('stepEmail').classList.remove('active');
        document.getElementById('stepCode').classList.add('active');
      }
    } catch(err){
      showStatus(extractErrorMessage(err), 'error');
    }
    btn.disabled = false;
    btn.textContent = 'Voye Kòd la';
  }

  async function verifyCode(e){
    e.preventDefault();
    hideStatus();
    const code = document.getElementById('codeInput').value.trim();
    const btn = document.getElementById('verifyBtn');
    btn.disabled = true;
    btn.textContent = 'Ap tcheke...';

    try {
      const { error } = await sb.auth.verifyOtp({ email: pendingEmail, token: code, type: 'email' });
      if(error){
        showStatus(extractErrorMessage(error), 'error');
      } else {
        showStatus('Ou konekte avèk siksè! (Pwochèn etap: dashboard la)', 'success');
      }
    } catch(err){
      showStatus(extractErrorMessage(err), 'error');
    }
    btn.disabled = false;
    btn.textContent = 'Konfime';
  }

  async function resendCode(){
    hideStatus();
    const { error } = await sb.auth.signInWithOtp({ email: pendingEmail, options: { shouldCreateUser: true } });
    showStatus(error ? extractErrorMessage(error) : 'Nou voye yon nouvo kòd.', error ? 'error' : 'success');
  }

  function backToEmail(){
    hideStatus();
    document.getElementById('stepCode').classList.remove('active');
    document.getElementById('stepEmail').classList.add('active');
  }

  async function handleGoogle(){
    hideStatus();
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google' });
    if(error) showStatus('Google poko konfigire sou kont sa a.', 'error');
  }
</script>
</body>
</html>
